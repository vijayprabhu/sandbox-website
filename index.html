<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily hello</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap');

    :root {
      color-scheme: light;
      --ink: #252331;
      --muted: #665f73;
      --surface: #fffdf8;
      --surface-container: #f4efff;
      --primary: #6750a4;
      --primary-dark: #4f378b;
      --secondary: #006a6a;
      --tertiary: #9c4146;
      --outline: #d1c5d8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 18%, #ffc86b 0 9%, transparent 25%),
        radial-gradient(circle at 90% 85%, #8de1d1 0 10%, transparent 28%),
        linear-gradient(135deg, #fff3d9 0%, #f0e8ff 52%, #dff8f2 100%);
      font-family: 'DM Sans', sans-serif;
    }

    main {
      width: min(100%, 560px);
    }

    .card {
      position: relative;
      overflow: hidden;
      padding: clamp(28px, 7vw, 48px);
      border: 1px solid rgb(255 255 255 / 75%);
      border-radius: 28px;
      background: rgb(255 253 248 / 90%);
      box-shadow: 0 24px 60px rgb(61 38 94 / 18%), 0 4px 10px rgb(61 38 94 / 8%);
      backdrop-filter: blur(16px);
    }

    .card::after {
      position: absolute;
      top: -56px;
      right: -50px;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: #ffb5c0;
      content: '';
      opacity: .7;
    }

    .eyebrow {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 22px;
      color: var(--primary-dark);
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--secondary);
      box-shadow: 0 0 0 5px #c8f2e6;
      content: '';
    }

    h1 {
      max-width: 390px;
      margin: 0;
      color: var(--ink);
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(2.6rem, 10vw, 4.6rem);
      line-height: .98;
      letter-spacing: -.04em;
    }

    .lead {
      max-width: 390px;
      margin: 18px 0 34px;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.55;
    }

    .details {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .detail {
      min-width: 0;
      padding: 18px;
      border-radius: 18px;
      background: var(--surface-container);
    }

    .detail:last-child {
      background: #e1f6f0;
    }

    .label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: .76rem;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .value {
      display: block;
      overflow: hidden;
      color: var(--primary-dark);
      font-size: 1.2rem;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #time {
      color: var(--secondary);
    }

    @media (max-width: 430px) {
      body {
        padding: 16px;
      }

      .details {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="card" aria-labelledby="greeting">
      <p class="eyebrow">A little hello</p>
      <h1 id="greeting">Hello world</h1>
      <p class="lead">A bright little snapshot of where you are and what time it is right now.</p>

      <div class="details">
        <div class="detail">
          <span class="label">Welcome from</span>
          <span class="value" id="country">Unknown</span>
        </div>
        <div class="detail">
          <span class="label">Local time</span>
          <time class="value" id="time"></time>
        </div>
      </div>
    </section>
  </main>

  <script>
    const countryElement = document.querySelector('#country');
    const timeElement = document.querySelector('#time');

    function getCountry() {
      const locale = navigator.language || 'en-US';
      const region = locale.match(/[-_]([A-Z]{2}|\d{3})$/i)?.[1]?.toUpperCase();

      if (!region || !('DisplayNames' in Intl)) {
        return region || 'Unknown';
      }

      return new Intl.DisplayNames([locale], { type: 'region' }).of(region) || region;
    }

    function updateTime() {
      const now = new Date();
      timeElement.textContent = now.toLocaleTimeString([], {
        hour: 'numeric',
        minute: '2-digit',
        second: '2-digit'
      });
      timeElement.dateTime = now.toISOString();
    }

    countryElement.textContent = getCountry();
    updateTime();
    setInterval(updateTime, 1000);
  </script>
</body>
</html>
