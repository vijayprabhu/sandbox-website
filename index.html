<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily hello</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap');

    :root {
      color-scheme: light;
      --ink: #252331;
      --muted: #665f73;
      --surface: #fffdf8;
      --surface-container: #f4efff;
      --primary: #6750a4;
      --primary-dark: #4f378b;
      --secondary: #006a6a;
      --tertiary: #9c4146;
      --outline: #d1c5d8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 18%, #ffc86b 0 9%, transparent 25%),
        radial-gradient(circle at 90% 85%, #8de1d1 0 10%, transparent 28%),
        linear-gradient(135deg, #fff3d9 0%, #f0e8ff 52%, #dff8f2 100%);
      font-family: 'DM Sans', sans-serif;
    }

    main {
      width: min(100%, 560px);
    }

    .card {
      position: relative;
      overflow: hidden;
      padding: clamp(28px, 7vw, 48px);
      border: 1px solid rgb(255 255 255 / 75%);
      border-radius: 28px;
      background: rgb(255 253 248 / 90%);
      box-shadow: 0 24px 60px rgb(61 38 94 / 18%), 0 4px 10px rgb(61 38 94 / 8%);
      backdrop-filter: blur(16px);
    }

    .card::after {
      position: absolute;
      top: -56px;
      right: -50px;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: #ffb5c0;
      content: '';
      opacity: .7;
    }

    .eyebrow {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 22px;
      color: var(--primary-dark);
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--secondary);
      box-shadow: 0 0 0 5px #c8f2e6;
      content: '';
    }

    h1 {
      max-width: 390px;
      margin: 0;
      color: var(--ink);
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(2.6rem, 10vw, 4.6rem);
      line-height: .98;
      letter-spacing: -.04em;
    }

    .lead {
      max-width: 390px;
      margin: 18px 0 34px;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.55;
    }

    .details {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .detail {
      min-width: 0;
      padding: 18px;
      border-radius: 18px;
      background: var(--surface-container);
    }

    .detail:last-child {
      background: #e1f6f0;
    }

    .label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: .76rem;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .value {
      display: block;
      overflow: hidden;
      color: var(--primary-dark);
      font-size: 1.2rem;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #time {
      color: var(--secondary);
    }

    .sky-position {
      margin-top: 12px;
      padding: 18px;
      border-radius: 18px;
      background: #e8f5f2;
    }

    .sky-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .sky-heading .label {
      margin: 0;
    }

    .location-button {
      padding: 8px 12px;
      border: 0;
      border-radius: 8px;
      color: white;
      background: var(--secondary);
      font: inherit;
      font-size: .85rem;
      font-weight: 700;
      cursor: pointer;
    }

    .location-button:hover {
      background: #005555;
    }

    .location-button:focus-visible {
      outline: 3px solid #252331;
      outline-offset: 3px;
    }

    .sky-chart {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }

    .sky-status,
    .sky-reading {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: .9rem;
      line-height: 1.4;
    }

    .sky-reading {
      color: var(--ink);
      font-weight: 700;
    }

    @media (max-width: 430px) {
      body {
        padding: 16px;
      }

      .details {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="card" aria-labelledby="greeting">
      <p class="eyebrow">A little hello</p>
      <h1 id="greeting">Hello world</h1>
      <p class="lead">A bright little snapshot of where you are and what time it is right now.</p>

      <div class="details">
        <div class="detail">
          <span class="label">Welcome from</span>
          <span class="value" id="country">Unknown</span>
        </div>
        <div class="detail">
          <span class="label">Local time</span>
          <time class="value" id="time"></time>
        </div>
      </div>

      <section class="sky-position" aria-labelledby="sky-title">
        <div class="sky-heading">
          <span class="label" id="sky-title">Sky position</span>
          <button class="location-button" id="locate" type="button">Use my location</button>
        </div>
        <svg class="sky-chart" viewBox="0 0 360 160" role="img" aria-labelledby="sky-chart-title sky-chart-description">
          <title id="sky-chart-title">Sun or moon position</title>
          <desc id="sky-chart-description">A compass chart showing the body's direction and height above or below the horizon.</desc>
          <rect x="12" y="18" width="336" height="128" rx="12" fill="#f8fcfa" />
          <line x1="18" y1="66" x2="342" y2="66" stroke="#d7e8e3" stroke-dasharray="4 5" />
          <line x1="18" y1="112" x2="342" y2="112" stroke="#718d86" stroke-width="1.5" />
          <text x="18" y="60" fill="#665f73" font-size="9">45°</text>
          <text x="18" y="106" fill="#665f73" font-size="9">0°</text>
          <g fill="#665f73" font-size="10" text-anchor="middle">
            <text x="22" y="136">N</text><text x="103" y="136">E</text>
            <text x="184" y="136">S</text><text x="265" y="136">W</text>
            <text x="338" y="136">N</text>
          </g>
          <g id="body-marker" visibility="hidden">
            <circle id="marker-halo" cx="0" cy="0" r="15" fill="#ffe08a" opacity=".45" />
            <circle id="marker-disc" cx="0" cy="0" r="9" fill="#f5a623" />
            <circle id="marker-cutout" cx="4" cy="-3" r="8" fill="#f8fcfa" visibility="hidden" />
          </g>
        </svg>
        <p class="sky-status" id="sky-status" aria-live="polite">Share your location to calculate the current sky position.</p>
        <p class="sky-reading" id="sky-reading" hidden></p>
      </section>
    </section>
  </main>

  <script>
    const countryElement = document.querySelector('#country');
    const timeElement = document.querySelector('#time');
    const locateButton = document.querySelector('#locate');
    const skyStatus = document.querySelector('#sky-status');
    const skyReading = document.querySelector('#sky-reading');
    const bodyMarker = document.querySelector('#body-marker');
    const markerHalo = document.querySelector('#marker-halo');
    const markerDisc = document.querySelector('#marker-disc');
    const markerCutout = document.querySelector('#marker-cutout');
    let coordinates;

    function getCountry() {
      const locale = navigator.language || 'en-US';
      const region = locale.match(/[-_]([A-Z]{2}|\d{3})$/i)?.[1]?.toUpperCase();

      if (!region || !('DisplayNames' in Intl)) {
        return region || 'Unknown';
      }

      return new Intl.DisplayNames([locale], { type: 'region' }).of(region) || region;
    }

    function updateTime() {
      const now = new Date();
      timeElement.textContent = now.toLocaleTimeString([], {
        hour: 'numeric',
        minute: '2-digit',
        second: '2-digit'
      });
      timeElement.dateTime = now.toISOString();
      if (coordinates) updateSkyPosition(now);
    }

    const toRadians = degrees => degrees * Math.PI / 180;
    const toDegrees = radians => radians * 180 / Math.PI;
    const normalizeDegrees = degrees => (degrees % 360 + 360) % 360;

    function equatorialToHorizontal(rightAscension, declination, date, latitude, longitude) {
      const julianDate = date.getTime() / 86400000 + 2440587.5;
      const centuries = (julianDate - 2451545) / 36525;
      const siderealTime = normalizeDegrees(
        280.46061837 + 360.98564736629 * (julianDate - 2451545) +
        0.000387933 * centuries ** 2 - centuries ** 3 / 38710000 + longitude
      );
      const hourAngle = toRadians(normalizeDegrees(siderealTime - rightAscension + 180) - 180);
      const lat = toRadians(latitude);
      const dec = toRadians(declination);
      const altitude = Math.asin(
        Math.sin(lat) * Math.sin(dec) + Math.cos(lat) * Math.cos(dec) * Math.cos(hourAngle)
      );
      const azimuth = normalizeDegrees(toDegrees(Math.atan2(
        Math.sin(hourAngle),
        Math.cos(hourAngle) * Math.sin(lat) - Math.tan(dec) * Math.cos(lat)
      )) + 180);
      return { altitude: toDegrees(altitude), azimuth };
    }

    function getSunPosition(date, latitude, longitude) {
      const julianDate = date.getTime() / 86400000 + 2440587.5;
      const days = julianDate - 2451545;
      const meanLongitude = normalizeDegrees(280.460 + 0.9856474 * days);
      const meanAnomaly = toRadians(normalizeDegrees(357.528 + 0.9856003 * days));
      const eclipticLongitude = toRadians(meanLongitude + 1.915 * Math.sin(meanAnomaly) + 0.020 * Math.sin(2 * meanAnomaly));
      const obliquity = toRadians(23.439 - 0.0000004 * days);
      const rightAscension = normalizeDegrees(toDegrees(Math.atan2(
        Math.cos(obliquity) * Math.sin(eclipticLongitude), Math.cos(eclipticLongitude)
      )));
      const declination = toDegrees(Math.asin(Math.sin(obliquity) * Math.sin(eclipticLongitude)));
      return equatorialToHorizontal(rightAscension, declination, date, latitude, longitude);
    }

    function getMoonPosition(date, latitude, longitude) {
      const julianDate = date.getTime() / 86400000 + 2440587.5;
      const days = julianDate - 2451543.5;
      const ascendingNode = toRadians(normalizeDegrees(125.1228 - 0.0529538083 * days));
      const inclination = toRadians(5.1454);
      const periapsis = toRadians(normalizeDegrees(318.0634 + 0.1643573223 * days));
      const eccentricity = 0.0549;
      const meanAnomaly = toRadians(normalizeDegrees(115.3654 + 13.0649929509 * days));
      let eccentricAnomaly = meanAnomaly + eccentricity * Math.sin(meanAnomaly) * (1 + eccentricity * Math.cos(meanAnomaly));
      for (let iteration = 0; iteration < 3; iteration += 1) {
        eccentricAnomaly -= (eccentricAnomaly - eccentricity * Math.sin(eccentricAnomaly) - meanAnomaly) /
          (1 - eccentricity * Math.cos(eccentricAnomaly));
      }
      const orbitalX = Math.cos(eccentricAnomaly) - eccentricity;
      const orbitalY = Math.sqrt(1 - eccentricity ** 2) * Math.sin(eccentricAnomaly);
      const trueAnomaly = Math.atan2(orbitalY, orbitalX);
      const distance = Math.hypot(orbitalX, orbitalY);
      const argument = trueAnomaly + periapsis;
      const x = distance * (Math.cos(ascendingNode) * Math.cos(argument) - Math.sin(ascendingNode) * Math.sin(argument) * Math.cos(inclination));
      const y = distance * (Math.sin(ascendingNode) * Math.cos(argument) + Math.cos(ascendingNode) * Math.sin(argument) * Math.cos(inclination));
      const z = distance * Math.sin(argument) * Math.sin(inclination);
      let eclipticLongitude = Math.atan2(y, x);
      let eclipticLatitude = Math.atan2(z, Math.hypot(x, y));

      const solarAnomaly = toRadians(normalizeDegrees(356.0470 + 0.9856002585 * days));
      const solarPeriapsis = toRadians(282.9404 + 4.70935e-5 * days);
      const solarLongitude = solarPeriapsis + solarAnomaly;
      const lunarMeanLongitude = ascendingNode + periapsis + meanAnomaly;
      const elongation = lunarMeanLongitude - solarLongitude;
      const latitudeArgument = lunarMeanLongitude - ascendingNode;
      eclipticLongitude += toRadians(
        -1.274 * Math.sin(meanAnomaly - 2 * elongation) + 0.658 * Math.sin(2 * elongation) -
        0.186 * Math.sin(solarAnomaly) - 0.059 * Math.sin(2 * meanAnomaly - 2 * elongation) -
        0.057 * Math.sin(meanAnomaly - 2 * elongation + solarAnomaly) + 0.053 * Math.sin(meanAnomaly + 2 * elongation) +
        0.046 * Math.sin(2 * elongation - solarAnomaly) + 0.041 * Math.sin(meanAnomaly - solarAnomaly) -
        0.035 * Math.sin(elongation) - 0.031 * Math.sin(meanAnomaly + solarAnomaly) -
        0.015 * Math.sin(2 * latitudeArgument - 2 * elongation) + 0.011 * Math.sin(meanAnomaly - 4 * elongation)
      );
      eclipticLatitude += toRadians(
        -0.173 * Math.sin(latitudeArgument - 2 * elongation) -
        0.055 * Math.sin(meanAnomaly - latitudeArgument - 2 * elongation) -
        0.046 * Math.sin(meanAnomaly + latitudeArgument - 2 * elongation) +
        0.033 * Math.sin(latitudeArgument + 2 * elongation) + 0.017 * Math.sin(2 * meanAnomaly + latitudeArgument)
      );

      const obliquity = toRadians(23.4393 - 3.563e-7 * days);
      const rightAscension = normalizeDegrees(toDegrees(Math.atan2(
        Math.sin(eclipticLongitude) * Math.cos(obliquity) - Math.tan(eclipticLatitude) * Math.sin(obliquity),
        Math.cos(eclipticLongitude)
      )));
      const declination = toDegrees(Math.asin(
        Math.sin(eclipticLatitude) * Math.cos(obliquity) +
        Math.cos(eclipticLatitude) * Math.sin(obliquity) * Math.sin(eclipticLongitude)
      ));
      return equatorialToHorizontal(rightAscension, declination, date, latitude, longitude);
    }

    function updateSkyPosition(date) {
      const sun = getSunPosition(date, coordinates.latitude, coordinates.longitude);
      const isSun = sun.altitude >= 0;
      const position = isSun ? sun : getMoonPosition(date, coordinates.latitude, coordinates.longitude);
      const directionNames = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
      const direction = directionNames[Math.round(position.azimuth / 45) % 8];
      const x = 18 + position.azimuth / 360 * 324;
      const y = Math.max(22, Math.min(148, 112 - position.altitude * 0.9));

      bodyMarker.setAttribute('transform', `translate(${x} ${y})`);
      bodyMarker.setAttribute('visibility', 'visible');
      markerHalo.setAttribute('fill', isSun ? '#ffe08a' : '#b4d8ef');
      markerDisc.setAttribute('fill', isSun ? '#f5a623' : '#ffffff');
      markerCutout.setAttribute('visibility', isSun ? 'hidden' : 'visible');
      skyStatus.textContent = `${isSun ? 'Sun' : 'Moon'} position for your location`;
      skyReading.hidden = false;
      skyReading.textContent = `${isSun ? 'Sun' : 'Moon'} · ${direction} ${Math.round(position.azimuth)}° · ${Math.round(position.altitude)}° ${position.altitude >= 0 ? 'above' : 'below'} horizon`;
    }

    function requestLocation() {
      if (!('geolocation' in navigator)) {
        skyStatus.textContent = 'Location is not available in this browser.';
        return;
      }

      locateButton.disabled = true;
      skyStatus.textContent = 'Waiting for location permission…';
      navigator.geolocation.getCurrentPosition(
        ({ coords }) => {
          coordinates = { latitude: coords.latitude, longitude: coords.longitude };
          locateButton.disabled = false;
          locateButton.textContent = 'Refresh position';
          updateSkyPosition(new Date());
        },
        error => {
          locateButton.disabled = false;
          skyStatus.textContent = error.code === error.PERMISSION_DENIED
            ? 'Location permission was denied. Allow it in your browser settings to see the sky position.'
            : 'Could not get your location. Check your connection or try again.';
        },
        { enableHighAccuracy: false, timeout: 10000, maximumAge: 300000 }
      );
    }

    locateButton.addEventListener('click', requestLocation);

    countryElement.textContent = getCountry();
    updateTime();
    setInterval(updateTime, 1000);
  </script>
</body>
</html>
